[package]
name = "clear_studio"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
symphonia = { version = "0.6.1", features = ["all"] }
hound = "3.5"
flacenc = "0.5"
realfft = "3.5"
cpal = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
mp3lame-encoder = "0.3.0"
vorbis_rs = "0.5.6"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
